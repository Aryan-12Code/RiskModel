version: '3.8'

services:
  web:
    build: .
    container_name: riskmodel-web
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./static/shap:/app/static/shap
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      - mlflow
    restart: unless-stopped
    networks:
      - riskmodel-net

  mlflow:
    image: python:3.10-slim
    container_name: riskmodel-mlflow
    command: >
      bash -c "pip install mlflow==2.9.2 &&
               mlflow server
               --host 0.0.0.0
               --port 5001
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5001:5001"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    networks:
      - riskmodel-net

volumes:
  mlflow-data:

networks:
  riskmodel-net:
    driver: bridge
