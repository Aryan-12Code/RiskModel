{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card rm-card rm-login-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock display-3 text-highlight mb-3"></i>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access the Risk Assessment System</p>
                </div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter username" required autofocus>
                        </div>
                        <div class="invalid-feedback">Please enter your username.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                    onclick="togglePasswordVisibility()">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>

                    <!-- Error Message -->
                    <div class="alert alert-danger d-none" id="loginError" role="alert">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        <span id="loginErrorText"></span>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-highlight btn-lg" id="loginSubmitBtn">
                            <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                            <span id="loginSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Signing in...
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Redirect if already logged in
    if (sessionStorage.getItem('rm_token')) {
        window.location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit);
});

function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
{% endblock %}
